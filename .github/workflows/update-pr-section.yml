name: Update merged PR section

on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_USERNAME: Ashishkumar1854
          SHOW_REPO_NAME: "false" # set to "true" to show private repo names
        run: python scripts/update_pr_section.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): update merged PR section"
          git push
